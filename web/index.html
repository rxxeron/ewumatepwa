  <!-- Enforce HTTPS Redirect -->
  <script>
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      location.replace('https://' + location.hostname + location.pathname + location.search);
    }
  </script>

  <!-- Device Guard Restrictor -->
  <script>
    (function() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
      const isAndroid = /Android/.test(userAgent);
      
      // Define a secret key only you know
      const SECRET_AUTH_KEY = "ewumate_admin_authorized_android_device_2026";
      
      // Check if device is already authorized in LocalStorage
      const isDeviceAuthorized = localStorage.getItem("android_device_authorized") === SECRET_AUTH_KEY;
      
      // Check if trying to authorize via secret URL query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const authQueryParam = urlParams.get("auth_android");
      
      if (authQueryParam === SECRET_AUTH_KEY) {
        localStorage.setItem("android_device_authorized", SECRET_AUTH_KEY);
        // Clean up the URL so the key doesn't leak in screenshots
        window.history.replaceState({}, document.title, window.location.pathname);
        return; // Access Granted
      }
      
      // Permit local development and testing
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (isLocalhost) {
        return;
      }
      
      // Gating Logic
      if (!isIOS) {
        if (isAndroid && isDeviceAuthorized) {
          return; // This specific Android device is authorized!
        }
        
        // Block all other devices (Desktops, other Androids, etc.)
        document.documentElement.innerHTML = `
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

                transition: transform 0.2s, box-shadow 0.2s;

              }
              .btn:hover {

            </style>

              <h1>iOS Device Required</h1>
              <p>This web portal is strictly restricted to <strong>iOS (iPhone/iPad)</strong> users. Android and desktop devices are not allowed to access this web application.</p>
              
              <a href="https://play.google.com/store/apps/details?id=com.rxxeron.ewumate" class="btn" target="_blank">

        // Stop further loading and execution
        window.stop();

  </script>

  <!-- JS PWA and Update Bridge -->
  <script>
    // Deferred install prompt storage
    window.deferredPrompt = null;
    window.onAppInstallableCallback = null;
    window.onAppInstalledCallback = null;
    window.onServiceWorkerUpdateCallback = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      if (window.onAppInstallableCallback) {
        window.onAppInstallableCallback();
      }
    });

    window.addEventListener('appinstalled', (e) => {
      window.deferredPrompt = null;
      if (window.onAppInstalledCallback) {
        window.onAppInstalledCallback();
      }
    });

    window.isPWAInstallable = function() {
      return window.deferredPrompt !== null;
    };

    window.isPWAStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };

    window.isIOSDevice = function() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    };

    window.triggerPWAInstall = async function() {
      const promptEvent = window.deferredPrompt;
      if (!promptEvent) return false;
      promptEvent.prompt();
      const { outcome } = await promptEvent.userChoice;
      window.deferredPrompt = null;
      return outcome === 'accepted';
    };

    // Listen to updates from Service Worker
    navigator.serviceWorker.getRegistration().then((reg) => {
      if (!reg) return;
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (newWorker == null) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            if (window.onServiceWorkerUpdateCallback) {
              window.onServiceWorkerUpdateCallback();
            }
          }
        });
      });
    });

    // Register Firebase Messaging Service Worker for push notifications
    // Uses a dedicated scope to avoid conflicts with Flutter's flutter_service_worker.js
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope',
        }).then(function (registration) {
          console.log('[FCM-SW] Firebase Messaging SW registered, scope:', registration.scope);
        }).catch(function (err) {
          console.error('[FCM-SW] Firebase Messaging SW registration failed:', err);
        });
      });
    }
  </script>

  <!-- Redirect non-root paths to index.html for SPA routing (GitHub Pages fix) -->
  <script>
    (function() {
      // Only redirect for regular navigation, not popups or OAuth callbacks
      var protocol = window.location.protocol;
      var hash = window.location.hash;
      var pathname = window.location.pathname;
      
      // Skip if blob protocol (popup) or already has hash
      if (protocol === 'blob:' || hash !== '' || pathname === '/') {
        return;
      }
      
      // Skip if it's an OAuth/callback URL (has 'state' or 'code' params)
      var params = new URLSearchParams(window.location.search);
      if (params.has('state') || params.has('code') || params.has('error')) {
        return;
      }
      
      // Redirect non-root paths
      if (!pathname.endsWith('.html') && pathname !== '/') {
        window.location.href = window.location.origin + '/';
      }
    })();
  </script>
