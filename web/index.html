<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Premium Mobile Assistant for East West University Students">
  
  <!-- GitHub Pages SPA routing fix -->
  <style>
    body { background: #0F172A; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EWUmate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- iOS Startup Splash Screens (Dark Mode #0F172A Theme) -->
  <!-- iPhone 15 Pro Max, 14 Pro Max -->
  <link rel="apple-touch-startup-image" href="icons/Icon-maskable-512.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)">
  <!-- iPhone 15 Pro, 15, 14 Pro -->
  <link rel="apple-touch-startup-image" href="icons/Icon-maskable-512.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)">
  <!-- iPhone 14 Plus, 13 Pro Max, 12 Pro Max -->
  <link rel="apple-touch-startup-image" href="icons/Icon-maskable-512.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)">
  <!-- iPhone 14, 13 Pro, 13, 12 Pro, 12 -->
  <link rel="apple-touch-startup-image" href="icons/Icon-maskable-512.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (prefers-color-scheme: dark)">
  <!-- iPhone SE (3rd Gen), SE (2nd Gen), 8, 7 -->
  <link rel="apple-touch-startup-image" href="icons/Icon-maskable-192.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EWUmate</title>
  <link rel="manifest" href="manifest.json">

  <!-- JS PWA and Update Bridge -->
  <script>
    // Deferred install prompt storage
    window.deferredPrompt = null;
    window.onAppInstallableCallback = null;
    window.onAppInstalledCallback = null;
    window.onServiceWorkerUpdateCallback = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      if (window.onAppInstallableCallback) {
        window.onAppInstallableCallback();
      }
    });

    window.addEventListener('appinstalled', (e) => {
      window.deferredPrompt = null;
      if (window.onAppInstalledCallback) {
        window.onAppInstalledCallback();
      }
    });

    window.isPWAInstallable = function() {
      return window.deferredPrompt !== null;
    };

    window.isPWAStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };

    window.isIOSDevice = function() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    };

    window.triggerPWAInstall = async function() {
      const promptEvent = window.deferredPrompt;
      if (!promptEvent) return false;
      promptEvent.prompt();
      const { outcome } = await promptEvent.userChoice;
      window.deferredPrompt = null;
      return outcome === 'accepted';
    };

    // Listen to updates from Service Worker
    navigator.serviceWorker.getRegistration().then((reg) => {
      if (!reg) return;
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (newWorker == null) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            if (window.onServiceWorkerUpdateCallback) {
              window.onServiceWorkerUpdateCallback();
            }
          }
        });
      });
    });
  </script>

  <!-- Redirect non-root paths to index.html for SPA routing (GitHub Pages fix) -->
  <script>
    (function() {
      // Only redirect for regular navigation, not popups or OAuth callbacks
      var protocol = window.location.protocol;
      var hash = window.location.hash;
      var pathname = window.location.pathname;
      
      // Skip if blob protocol (popup) or already has hash
      if (protocol === 'blob:' || hash !== '' || pathname === '/') {
        return;
      }
      
      // Skip if it's an OAuth/callback URL (has 'state' or 'code' params)
      var params = new URLSearchParams(window.location.search);
      if (params.has('state') || params.has('code') || params.has('error')) {
        return;
      }
      
      // Redirect non-root paths
      if (!pathname.endsWith('.html') && pathname !== '/') {
        window.location.href = window.location.origin + '/';
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
