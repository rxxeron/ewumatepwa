<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- GitHub Pages SPA routing fix -->
  <style>
    body { background: #0F172A; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EWUmate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EWUmate</title>
  <link rel="manifest" href="manifest.json">

  <!-- Redirect non-root paths to index.html for SPA routing (GitHub Pages fix) -->
  <script>
    (function() {
      // Only redirect for regular navigation, not popups or OAuth callbacks
      var protocol = window.location.protocol;
      var hash = window.location.hash;
      var pathname = window.location.pathname;
      
      // Skip if blob protocol (popup) or already has hash
      if (protocol === 'blob:' || hash !== '' || pathname === '/') {
        return;
      }
      
      // Skip if it's an OAuth/callback URL (has 'state' or 'code' params)
      var params = new URLSearchParams(window.location.search);
      if (params.has('state') || params.has('code') || params.has('error')) {
        return;
      }
      
      // Redirect non-root paths
      if (!pathname.endsWith('.html') && pathname !== '/') {
        window.location.href = window.location.origin + '/';
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
